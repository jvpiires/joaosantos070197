spring:
  application:
    name: sgd-backend
  
  # Conexão com o Banco (PostgreSQL)
  datasource:
    url: jdbc:postgresql://database:5432/db_discografia_core?currentSchema=public
    username: srv_discografia
    password: P@ssw0rd_Seplag2026!
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Versionamento de Banco (Flyway)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public

  # Configuração de Upload
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Configuração Personalizada do MinIO (S3)
sgd:
  storage:
    url: http://storage:9000
    public-url: http://localhost:9000
    access-key: admin_storage
    secret-key: Storage_Key_2026!
    bucket-name: capas-albuns-media
    region: us-east-1

# Monitoramento (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true